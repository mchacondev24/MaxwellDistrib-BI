# =====================================================================
# Apache VirtualHost & Reverse Proxy Configuration for NicaDistrib BI
# Servidor: Apache HTTP Server 2.4+
# Dominio / Host: ingemaxwellchacon.com
# Carpeta de destino: /home/ingefknc/public_html/Portafolio/NicaDistrib-BI
# =====================================================================

<VirtualHost *:80>
    ServerName ingemaxwellchacon.com
    ServerAlias www.ingemaxwellchacon.com
    DocumentRoot /home/ingefknc/public_html

    # Directorio de la App Angular / Portafolio
    <Directory "/home/ingefknc/public_html/Portafolio/NicaDistrib-BI">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Reglas de Reescritura para Single Page Application (SPA)
        # Previene el error 404 al refrescar rutas como /dashboard, /inventario, etc.
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /Portafolio/NicaDistrib-BI/
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /Portafolio/NicaDistrib-BI/index.html [L]
        </IfModule>
    </Directory>

    # Proxy inverso hacia la API de FastAPI (Uvicorn puerto 8000)
    <IfModule mod_proxy.c>
        ProxyPreserveHost On
        ProxyPass /api http://127.0.0.1:8000/api
        ProxyPassReverse /api http://127.0.0.1:8000/api
    </IfModule>

    # Configuración de compresión GZIP para rendimiento móvil
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json
    </IfModule>

    # Caché de archivos estáticos (JS, CSS, Imágenes)
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/svg+xml "access plus 1 month"
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/nicadistrib_error.log
    CustomLog ${APACHE_LOG_DIR}/nicadistrib_access.log combined
</VirtualHost>
